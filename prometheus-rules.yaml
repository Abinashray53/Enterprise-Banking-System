apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  banking-services.yaml: |
    groups:
      - name: banking-services
        rules:
          - alert: BankingServiceDown
            expr: up{job="banking-services"} == 0
            for: 2m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "Banking service is unavailable"
              description: "{{ $labels.kubernetes_service_name }} has been unreachable for more than two minutes."

          - alert: BankingServiceHigh5xxRate
            expr: |
              (
                sum by (job, kubernetes_service_name) (rate(http_server_requests_seconds_count{job="banking-services",status=~"5.."}[5m]))
                /
                sum by (job, kubernetes_service_name) (rate(http_server_requests_seconds_count{job="banking-services"}[5m]))
              ) > 0.02
              and
              sum by (job, kubernetes_service_name) (rate(http_server_requests_seconds_count{job="banking-services"}[5m])) > 0
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "Banking service has an elevated 5xx rate"
              description: "{{ $labels.kubernetes_service_name }} has returned more than 2% server errors for ten minutes."
