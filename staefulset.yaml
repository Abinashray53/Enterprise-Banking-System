apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis
  namespace: banking

  labels:
    app: redis

spec:

  serviceName: redis

  replicas: 6

  selector:

    matchLabels:

      app: redis

  template:

    metadata:

      labels:

        app: redis

    spec:

      securityContext:

        fsGroup: 1001

      containers:

      - name: redis

        image: redis:7.2

        imagePullPolicy: IfNotPresent

        command:

        - redis-server

        args:

        - /etc/redis/redis.conf

        - --requirepass

        - $(REDIS_PASSWORD)

        env:

        - name: REDIS_PASSWORD

          valueFrom:

            secretKeyRef:

              name: redis-secret

              key: REDIS_PASSWORD

        ports:

        - containerPort: 6379

          name: redis

        resources:

          requests:

            cpu: "500m"

            memory: "1Gi"

          limits:

            cpu: "2"

            memory: "4Gi"

        volumeMounts:

        - name: redis-data

          mountPath: /data

        - name: redis-config

          mountPath: /etc/redis

        readinessProbe:

          exec:

            command:

            - redis-cli

            - ping

          initialDelaySeconds: 20

          timeoutSeconds: 5

        livenessProbe:

          exec:

            command:

            - redis-cli

            - ping

          initialDelaySeconds: 60

          timeoutSeconds: 5

      volumes:

      - name: redis-config

        configMap:

          name: redis-config

  volumeClaimTemplates:

  - metadata:

      name: redis-data

    spec:

      accessModes:

      - ReadWriteOnce

      resources:

        requests:

          storage: 20Gi

      storageClassName: gp3