apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-deployment
  namespace: banking-system
  labels:
    app: customer-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
        tier: backend
    spec:
      serviceAccountName: customer-serviceaccount
      containers:
        - name: customer-service
          image: your-registry/customer-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: customer-service-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      imagePullSecrets:
        - name: regcred
        
