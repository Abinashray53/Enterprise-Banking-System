apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: customer-service-rolebinding
  namespace: banking-system
subjects:
  - kind: ServiceAccount
    name: customer-serviceaccount
    namespace: banking-system
roleRef:
  kind: Role
  name: customer-service-role
  apiGroup: rbac.authorization.k8s.io
